<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Product Price List</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- DataTables -->
    <link href="https://cdn.datatables.net/1.13.6/css/dataTables.bootstrap5.min.css" rel="stylesheet">
    <link href="https://cdn.datatables.net/responsive/2.5.0/css/responsive.bootstrap5.min.css" rel="stylesheet">

    <style>
        /* General */
        body {
            background: #f5f7fa;
        }

        /* Card feel */
        .card {
            border-radius: 12px;
        }

        th,
        td {
            white-space: nowrap;
        }

        #productTable td:first-child,
        #productTable th:first-child {
            width: 50px;
            text-align: center;
        }

        .table-responsive {
            overflow-x: auto;
        }

        table.dataTable {
            white-space: nowrap;
        }

        /* Mobile Optimization */
        @media (max-width: 768px) {

            h3 {
                font-size: 20px;
                text-align: center;
            }

            .form-control {
                font-size: 16px;
                padding: 12px;
            }

            .btn {
                font-size: 16px;
                padding: 0px;
            }

            table.dataTable td {
                font-size: 14px;
            }
        }

        /* Action button full width on mobile */
        .editBtn {
            width: 100%;
        }
    </style>

</head>

<body>

    <div class="container py-3">

        <div class="card shadow p-3">

            <h3 class="mb-3">📦 Product Price List</h3>

            <!-- FORM -->
            <form id="addForm" class="row g-2 mb-3">
                <div class="col-12 col-md-5">
                    <input type="text" id="product_name" class="form-control" placeholder="Product Name" required>
                </div>

                <div class="col-12 col-md-4">
                    <input type="number" id="price" class="form-control" placeholder="Price" required>
                </div>

                <div class="col-12 col-md-3">
                    <button type="submit" class="btn btn-primary w-100">➕ Add Product</button>
                </div>
            </form>

            <!-- TABLE -->
            <div class="table-responsive">
                <table id="productTable" class="table table-bordered table-striped nowrap" style="width:100%">
                    <thead class="table-dark">
                        <tr>
                            <th>ID</th>
                            <th>Product Name</th>
                            <th>Price (₹)</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>

        </div>

    </div>

    <!-- EDIT MODAL -->
    <div class="modal fade" id="editModal">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">

                <div class="modal-header">
                    <h5>Edit Product</h5>
                    <button class="btn-close" data-bs-dismiss="modal"></button>
                </div>

                <div class="modal-body">
                    <input type="hidden" id="edit_id">
                    <input type="text" id="edit_name" class="form-control mb-2" placeholder="Product Name">
                    <input type="number" id="edit_price" class="form-control" placeholder="Price">
                </div>

                <div class="modal-footer">
                    <button class="btn btn-success w-100" id="updateBtn">Update</button>
                </div>

            </div>
        </div>
    </div>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <!-- Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- DataTables -->
    <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.6/js/dataTables.bootstrap5.min.js"></script>

    <!-- Responsive -->
    <script src="https://cdn.datatables.net/responsive/2.5.0/js/dataTables.responsive.min.js"></script>
    <script src="https://cdn.datatables.net/responsive/2.5.0/js/responsive.bootstrap5.min.js"></script>

    <script>
        $(document).ready(function () {

            var table = $('#productTable').DataTable({
                responsive: false,   // ❌ Disable hiding
                autoWidth: false,
                scrollX: true        // ✅ Enable horizontal scroll on mobile
            });

            loadProducts();

            // LOAD PRODUCTS
            function loadProducts() {
                $.get('fetch_products.php', function (data) {

                    let products = JSON.parse(data);
                    table.clear();

                    products.forEach(p => {
                        table.row.add([
                            p.id,
                            p.product_name,
                            '₹ ' + p.price,
                            `
                    <button class="btn btn-warning btn-sm editBtn"
                        data-id="${p.id}"
                        data-name="${p.product_name}"
                        data-price="${p.price}">
                        ✏️ Edit
                    </button>
                    `
                        ]);
                    });

                    table.draw();
                });
            }

            // ADD PRODUCT
            $('#addForm').submit(function (e) {
                e.preventDefault();

                $.post('save_product.php', {
                    product_name: $('#product_name').val(),
                    price: $('#price').val()
                }, function () {
                    loadProducts();
                    $('#addForm')[0].reset();
                });
            });

            // EDIT CLICK
            $('#productTable').on('click', '.editBtn', function () {
                $('#edit_id').val($(this).data('id'));
                $('#edit_name').val($(this).data('name'));
                $('#edit_price').val($(this).data('price'));

                var modal = new bootstrap.Modal(document.getElementById('editModal'));
                modal.show();
            });

            // UPDATE PRODUCT
            $('#updateBtn').click(function () {
                $.post('update_product.php', {
                    id: $('#edit_id').val(),
                    product_name: $('#edit_name').val(),
                    price: $('#edit_price').val()
                }, function () {
                    loadProducts();

                    var modalEl = document.getElementById('editModal');
                    var modal = bootstrap.Modal.getInstance(modalEl);
                    modal.hide();
                });
            });

        });
    </script>

</body>

</html>
